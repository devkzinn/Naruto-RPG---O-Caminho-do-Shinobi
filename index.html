:root[data-theme="dark"]{--bg:#15110d;--cd:#211b15;--tx:#f1e8da;--mu:#a8987f;--bd:#3a3026}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:14px}

h1{font-size:24px;margin:8px 0}h3,h4{margin:10px 0 6px}h4{color:var(--mu);font-size:14px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:8px}
.loc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.b{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:48px;font:inherit;line-height:1.35;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;cursor:pointer;text-align:left;overflow-wrap:anywhere;transition:border-color .15s,background-color .15s,transform .15s}
.b:hover{border-color:var(--ac);transform:translateY(-1px)}.b:active{transform:translateY(0)}.b:focus-visible{outline:3px solid var(--ck);outline-offset:2px}.b small{display:block;color:var(--mu);font-size:12px;line-height:1.35}
.p{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;font-weight:600}
.lock{opacity:.55}
input[type=text],input[type=number]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
.br{position:relative;height:18px;background:var(--bg);border:1px solid var(--bd);border-radius:9px;margin:4px 0;overflow:hidden;font-size:12px}
.br i{position:absolute;left:0;top:0;bottom:0;opacity:.45}.br span{position:relative;padding-left:8px}
#log{height:240px;overflow-y:auto;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:8px 12px}
#log p{margin:5px 0}.sys{color:var(--mu);font-style:italic}.ok{color:#2f9e44;font-weight:600}.bad{color:var(--hp)}.bt{font-weight:600}
.rk{display:inline-block;min-width:22px;text-align:center;border-radius:6px;color:#fff;font-weight:700;padding:0 5px;margin-right:6px}
.rkD{background:#868e96}.rkC{background:#2f9e44}.rkB{background:#1c7ed6}.rkA{background:#7048e8}.rkS{background:#c92a2a}
.el label{display:block;border:1px solid var(--bd);border-radius:10px;padding:8px;cursor:pointer}
.el input{margin-right:6px}[hidden]{display:none!important}
.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1;min-width:0}.row>.b{flex:0 0 auto}
@media(max-width:480px){main{padding:10px}.c{padding:10px}.row{flex-direction:column;align-items:stretch}.row>.b{width:100%}.b{padding:10px}}

/* ================= 8. MISSÕES (rank D a S) ================= */
function smis(i){const m=MS[i];M={m,i,s:0,n:2+MSK.indexOf(m[0]),failures:0,successes:0};log(`📜 <b>Missão rank ${m[0]}: ${m[1]}</b> — ${m[2]}`);nx()}
function nx(){if(M.s<M.n){const scene=M.s==0?MSTEP[M.i]:P(STP);M.cur=M.failures&&M.s==M.n-1?[`Por causa dos contratempos, você chega sob pressão. ${scene[0]}`,scene[1]]:scene;mode='mis';render()}else{const m=M.m;if(m[6]){const goal=OBJ[m[6]];M.cur=[M.failures?`${goal[0]} As dificuldades anteriores deixaram pouco tempo para concluir.`:goal[0],goal[1]];mode='goal';render();return}const base=EN[m[3]],f=M.failures,e=[base[0],Math.round(base[1]*(1+f*.08)),Math.round(base[2]*(1+f*.05)),base[3],base[4]];log(f?`Os contratempos alertaram o inimigo. ${e[4]?'O líder':'O adversário'} espera por você.`:e[4]?`Você chega ao covil… e o líder da missão o aguarda.`:'Você chega ao objetivo e o confronto é inevitável!','bt');
fight(e,{win:()=>{S.ryo+=m[4];gain(m[5]);S.done++;log(`✅ Missão rank ${m[0]} cumprida! +${m[4]} ryo e +${m[5]} XP. (Total: ${S.done})`,'ok');M=null;tick(1)}})}}
function pick(j){const c=M.cur[1][j],ri=MSK.indexOf(M.m[0]),dc=10+ri*3,r=R(1,20),tt=r+S[c[1]];
log(`🎲 ${c[0]}: ${r} + ${S[c[1]]} = ${tt} (precisa de ${dc})`,'sys');
if(tt>=dc){M.successes++;gain(8+ri*2);log('Deu certo! Você avança.','ok')}else{M.failures++;const d=6+ri*4;S.hp=Math.max(1,S.hp-d);log(`Falhou e perdeu ${d} HP, mas segue em frente. O contratempo pode tornar o final mais difícil.`,'bad')}
M.s++;tick(1);nx()}
function pickGoal(j){const m=M.m,c=M.cur[1][j],ri=MSK.indexOf(m[0]),dc=12+ri*3+(M.failures||0)*2,r=R(1,20),tt=r+S[c[1]];log(`🎲 ${c[0]}: ${r} + ${S[c[1]]} = ${tt} (precisa de ${dc})`,'sys');
if(tt>=dc){S.ryo+=m[4];gain(m[5]);S.done++;log(`✅ Objetivo concluído! +${m[4]} ryo e +${m[5]} XP. Missões concluídas: ${S.done}.`,'ok')}
else{const d=8+ri*3;S.hp=Math.max(1,S.hp-d);gain(Math.floor(m[5]*.25));log(`❌ O objetivo não foi concluído. Você perde ${d} HP e recebe XP pela experiência da tentativa, mas sem recompensa ou crédito de missão.`,'bad')}
M=null;mode='map';tick(1);render()}

/* ===== Bloco 9: renderização das telas e interface do jogo ===== */
const back=btn('↩️ Voltar',"mode='map';render()");
function vMap(){const x=EXR[S.rk],ex=S.rk<3&&S.loc==x.loc&&(S.rk>0||S.a>10||(S.academySessions||0)>=4);
const people=pres(S.loc).map(id=>btn(`${N[id][1]} ${N[id][0]}<small>${ageOf(id)} anos · ${N[id][2]}</small><small>${rl(S.rel[id]||0)}${S.rs[id]=='couple'?' · 💞':''}</small>`,`npc('${id}')`)).join('');
const places=LOC_GROUPS.map(([group,keys])=>{const cards=keys.filter(k=>k!=S.loc).map(k=>{const req=LOC_REQ[k],locked=req&&(S.rk<req.rk||S.done<req.done),detail=locked?`Bloqueado · rank ${RK[req.rk]} · ${req.done} missões`:'Viajar para este local';return btn(`${L[k][0]} ${L[k][1]}<small>${detail}</small>`,`go('${k}')`,locked?'lock':'')}).join('');return cards?`<h4>${group}</h4><div class="loc-grid">${cards}</div>`:''}).join('');
return `<h3>${L[S.loc][0]} ${L[S.loc][1]}</h3><h4>Pessoas por perto</h4><div class="g">${people||'<small>Ninguém está por aqui agora.</small>'}</div>`+
`<h4>Explorar locais</h4>${places}`+
`<h4>Treino</h4><small style="color:var(--mu)">Fadiga ${S.fatigue||0}% · Tai ${S.practice?.tai||0}/3 · Vel ${S.practice?.vel||0}/3 · Nin ${S.practice?.nin||0}/3 · Int ${S.practice?.int||0}/3</small><div class="g">`+
btn('🥋 Treino físico<small>Desenvolve Tai · aumenta fadiga</small>',"self('tai')")+btn('🏃 Treino de agilidade<small>Desenvolve Vel · aumenta fadiga</small>',"self('vel')")+btn('🌀 Controle de chakra<small>Desenvolve Nin · custa chakra</small>',"self('nin')")+btn('📖 Estudo tático<small>Desenvolve Int · exige concentração</small>',"self('int')")+btn('🎯 Praticar jutsu<small>Consome chakra e aumenta maestria</small>',"mode='jt';render()")+
`</div><h4>Recuperação e itens</h4><div class="g">`+btn('🧘 Meditar<small>Recupera chakra e reduz fadiga</small>',"self('m')")+btn('🛏️ Dormir<small>Avança até amanhã e restaura energia</small>',"self('s')")+(S.kit?btn('🩹 Usar kit médico<small>Recupera até 40 HP</small>',"item('kit')"):'')+(S.pill?btn('💊 Usar pílula<small>Recupera até 40 chakra</small>',"item('pill')"):'')+
`</div><h4>Serviços</h4><div class="g">`+(S.loc=='torre'&&S.rk>0?btn('📜 Abrir mural de missões<small>Escolha um contrato disponível</small>',"mode='ms';render()",'p'):'')+(S.loc=='mercado'?btn('🛒 Abrir loja ninja<small>Suprimentos e pergaminhos</small>',"mode='shop';render()",'p'):'')+
(S.loc=='academia'&&S.rk==0&&S.a<=10?btn(`📚 Aula prática<small>${S.academySessions||0}/4 aulas concluídas</small>`,'academyClass()'):'')+
(ex?btn(`${x.nm}<small>${exok(x)?'Pronto para realizar':`Requisitos: ${exreq(x)}`}</small>`,'exam()',exok(x)?'p':'lock'):'')+
`</div><h4>Ação livre</h4><div class="row"><input type="text" id="fr" placeholder="Ex.: conversar com Naruto, comer ramen ou explorar" onkeydown="if(event.key=='Enter')fr()">${btn('Executar','fr()','p')}</div>`}
function vNpc(){const id=T,n=N[id],lv=S.love[id]||0,st=S.rs[id];
let h=`<h3>${n[1]} ${n[0]}</h3><small style="color:var(--mu)">${ageOf(id)} anos · ${n[2]} · Afinidade: ${rl(S.rel[id]||0)} (${S.rel[id]||0})</small><h4>Interações</h4><div class="g">`+btn('💬 Conversar<small>Trocar algumas palavras</small>',"dn('talk')")+btn('🥋 Treinar juntos<small>Ganha afinidade e prática</small>',"dn('train')")+btn('⚔️ Duelo amistoso<small>Combate sem risco de missão</small>',"dn('duel')")+btn('🤝 Pedir conselho<small>Requer afinidade 35</small>',"dn('adv')")+btn('😈 Provocar<small>Pode começar uma briga</small>',"dn('bully')")+(SEN[id]?btn('🎓 Aprender técnicas<small>Treino especial com sensei</small>',"mode='sen';render()",'p'):'')+back
+'</div><h4>Presentear</h4><div class="g">'+Object.keys(G).map(g=>btn(`${G[g][0]}<small>${G[g][1]} ryo</small>`,`dn('gift','${g}')`)).join('')+'</div>';
if(rom(id))h+=`<h4>Romance${st=='couple'?' · 💞 Namorando':st=='date'?' · 💕 Saindo juntos':''}</h4>`+bar('💗 Intimidade',lv,100,'lv')+'<div class="g">'+btn('😉 Flertar',"flirt()")+btn('🌹 Convidar para sair<small>40 ryo</small>',"inv()")
+(st=='date'?btn('💍 Pedir em namoro',"ask()"):'')+(st=='couple'?btn('🍃 Tempo juntos',"couple('t')")+btn('💋 Beijar',"couple('k')")+btn('🌙 Noite a dois',"couple('n')")+btn('💔 Terminar',"couple('x')"):'')+'</div>';
return h+`<h4>Assuntos rápidos</h4><div class="g">`+btn('📍 Local atual',"say('Onde estamos agora?')")+btn('📜 Missões',"say('Como está a missão atual?')")+btn('🥋 Treinamento',"say('Como posso melhorar no treinamento?')")+btn('🌠 Sonhos',"say('Qual é o seu maior sonho?')")+btn('🧑‍🤝‍🧑 Equipe',"say('O que faz uma boa equipe?')")+btn('🎂 Idade',"say('Quantos anos você tem?')")+`</div><h4>Mensagem</h4><div class="row"><input type="text" id="fr" maxlength="180" placeholder="Converse com ${n[0]} sobre uma missão, treino, local ou outro assunto…" onkeydown="if(event.key=='Enter')say()">${btn('Enviar','say()','p')}</div>`}
const vDate=()=>`<h3>🌹 Encontro com ${N[T][0]}</h3><p>Como vocês vão passar o tempo?</p><div class="g">`+DT.map((d,i)=>btn(`${d[0]}<small>usa ${d[1].toUpperCase()}</small>`,`dt(${i})`)).join('')+'</div>';
const vBattle=()=>`<h3>${B.boss?'👹':'⚔️'} ${B.n} ${B.el?E[B.el][1]:''}</h3>`+bar(B.boss?(B.ph?'Chefe · Fase 2':'Chefe'):'Inimigo',B.hp,B.mx,'hp')+(B.ch?'<p class="bad"><b>⚠️ Ataque forte no próximo turno: escolha Defender.</b></p>':'')+'<h4>Sua ação</h4><div class="g">'+btn('👊 Golpe de taijutsu<small>Dano físico, sem custo de chakra</small>',"act('tai')")+S.jt.map(k=>btn(`${jn(k)}<small>${jc(k)} chakra · Maestria ${mlv(k)}</small>`,`act('jut','${k}')`)).join('')+btn('🛡️ Defender<small>Reduz dano e recupera chakra</small>',"act('def')")+(S.kit?btn('🩹 Kit médico<small>Recupera até 40 HP</small>',"act('kit')"):'')+(S.pill?btn('💊 Pílula<small>Recupera até 40 chakra</small>',"act('pill')"):'')+btn('💨 Tentar fugir<small>Chefes não permitem fuga</small>',"act('run')")+'</div>';
const vMis=()=>`<h3>📜 ${M.m[1]} ${rkb(M.m[0])}</h3><small style="color:var(--mu)">Etapa ${M.s+1}/${M.n} · ${M.successes||0} sucessos · ${M.failures||0} contratempos${M.m[3]&&EN[M.m[3]][4]?' · chefe no final':''}</small><p>${M.cur[0]}</p><div class="g">`+M.cur[1].map((c,i)=>btn(`${c[0]}<small>Teste de ${c[1].toUpperCase()}</small>`,`pick(${i})`)).join('')+'</div>';
const vGoal=()=>`<h3>🎯 Objetivo da missão: ${M.m[1]}</h3><small style="color:var(--mu)">Etapa final · rank ${M.m[0]} · contratempos anteriores: ${M.failures||0}. Escolha uma abordagem.</small><p>${M.cur[0]}</p><div class="g">`+M.cur[1].map((c,i)=>btn(`${c[0]}<small>Teste de ${c[1].toUpperCase()}</small>`,`pickGoal(${i})`)).join('')+'</div>';
const MTYPE={deliver:'Entrega',retrieve:'Recuperação',escort:'Escolta',rescue:'Resgate',protect:'Proteção'};
const vBoard=()=>'<h3>📜 Mural de missões</h3><small style="color:var(--mu)">Os contratos mostram rank, resumo, recompensa e requisito de acesso.</small><div class="g" style="margin-top:8px">'+MS.map((m,i)=>({m,i})).sort((a,b)=>MSK.indexOf(a.m[0])-MSK.indexOf(b.m[0])).map(({m,i})=>{const r=m[0],ok=S.rk>=NEED[r]&&S.lv>=LVN[r],lk=ok?'':`🔒 ${RK[NEED[r]]}, nível ${LVN[r]}`,kind=m[6]?MTYPE[m[6]]:(EN[m[3]]?.[4]?'Combate contra chefe':'Combate');return btn(`${rkb(r)}${m[1]}<small>${m[2]}</small><small>${kind} · ${m[4]} ryo · ${m[5]} XP${lk?' · '+lk:''}</small>`,ok?`smis(${i})`:`log('🔒 Requer ${RK[NEED[r]]} e nível ${LVN[r]}.','sys')`,ok?'':'lock')}).join('')+back+'</div>';
const vShop=()=>'<h3>🛒 Loja ninja</h3><div class="g">'+btn('🩹 Kit médico<small>25 ryo · +40 HP</small>',"buy('kit',25)")+btn('💊 Pílula de soldado<small>30 ryo · +40 chakra</small>',"buy('pill',30)")+btn('📜 Pergaminho de treino<small>120 ryo · +1 atributo</small>',"buy('scr',120)")+back+'</div>';
const jn=k=>{const[e,i]=k.split(':');return E[e][1]+' '+E[e][3][i]};
const vJt=()=>'<h3>🎯 Praticar jutsu</h3><small style="color:var(--mu)">A cada 8 usos a Maestria sobe (máx. 5): +12% de dano e −7% de custo por nível. Usar em combate e treinar com alguém também conta.</small><div class="g" style="margin-top:8px">'+S.jt.map(k=>btn(`${jn(k)}<small>Maestria ${mlv(k)}/5 · ${jc(k)} chakra</small>`,`prac('${k}')`)).join('')+back+'</div>';
const vSen=()=>{const id=T,n=N[id];return `<h3>🎓 Treinar com ${n[0]}</h3><small style="color:var(--mu)">Afinidade 40+. Elementos: ${els().length}/${Math.max(1,S.rk)} (Chunin libera o 2º, Jounin o 3º).</small>`+SEN[id].map(e=>`<h4>${E[e][1]} ${E[e][0]}</h4><div class="g">`+[0,1,2].map(i=>{const k=e+':'+i,has=S.jt.includes(k);return btn(`${has?'✔ ':''}${E[e][3][i]}<small>${has?'Dominado · Maestria '+mlv(k):'Nv '+TL[i]+' · '+TC[i]+' ryo'}</small>`,has?"log('Você já domina esta técnica.','sys')":`teach('${k}')`,has?'lock':'')}).join('')+'</div>').join('')+`<div class="row">${back}</div>`};
const vEx=()=>{const g=EXS[X.rk][X.s],n=g.t=='quiz'?g.qs.length:g.c;return `<h3>🏟️ ${g.n}</h3><small style="color:var(--mu)">Prova ${X.i+1}/${n} · acertos ${X.ok} (mínimo ${g.need})</small>`+(g.t=='quiz'?`<p>${g.qs[X.i][0]}</p><div class="g">`+g.qs[X.i][1].map((o,j)=>btn(o,`exa(${j})`)).join('')+'</div>':`<p>${X.cur[0]}</p><div class="g">`+X.cur[1].map((c,j)=>btn(`${c[0]}<small>usa ${c[1].toUpperCase()}</small>`,`exa(${j})`)).join('')+'</div>')};
const V={map:vMap,npc:vNpc,date:vDate,battle:vBattle,mis:vMis,goal:vGoal,ms:vBoard,shop:vShop,jt:vJt,sen:vSen,ex:vEx};
function render(){
$('#st').innerHTML=`<b>${esc(S.n)}</b> · ${S.a} anos · ${E[S.el][1]} ${E[S.el][0]} · ${RK[S.rk]} · Nv ${S.lv}`+bar('❤️ HP',S.hp,S.mh,'hp')+bar('💠 Chakra',S.ck,S.mc,'ck')+bar('✨ XP',S.xp,S.lv*40,'ac')+`<small style="color:var(--mu)">💰 ${S.ryo} ryo · Dia ${S.day} (${TM[S.t]}) · Ano ${1+(S.worldYears||0)} · próximo aniversário em ${DAYS_PER_YEAR-(S.ageDays||0)} dias · Fadiga ${S.fatigue||0}% · Nin ${S.nin} · Tai ${S.tai} · Vel ${S.vel} · Int ${S.int} · Car ${S.car} · 🩹${S.kit} 💊${S.pill} · 📜 ${S.done} missões</small>`;
$('#pn').innerHTML=V[mode]()}

/* ===== Bloco 10: inicialização do jogo ===== */
$('#els').innerHTML=Object.keys(E).map((k,i)=>`<label><input type="radio" name="el" value="${k}" ${i?'':'checked'}>${E[k][1]} ${E[k][0]}</label>`).join('');
if(ld())$('#ct').hidden=false;
const show=()=>{$('#cr').hidden=true;$('#gm').hidden=false;render()};
function cont(){const v=ld();S=Object.assign(fresh(v.n,v.a,v.el),v);S.pres={};[0,1,2].forEach(i=>S.lv>=[1,4,8][i]&&learn(S.el+':'+i));mode='map';show();log('Você retoma sua jornada em Konoha.','sys')}
function newg(){if(confirm('Começar um novo jogo? O progresso atual será perdido.')){try{localStorage.removeItem(SV);localStorage.removeItem('naruto-rpg-v1')}catch(e){}location.reload()}}
function start(){const n=$('#nm').value.trim()||'Shinobi',a=Math.min(40,Math.max(6,+$('#ag').value||12)),el=document.querySelector('input[name=el]:checked').value;
S=fresh(n,a,el);if(a>=16)ST.forEach(k=>S[k]+=2);S[({fogo:'nin',agua:'int',vento:'vel',terra:'tai',relampago:'nin'})[el]]+=2;
mode='map';$('#log').innerHTML='';show();
log(`🍃 Bem-vindo(a) a Konoha, <b>${esc(n)}</b>! Aos ${a} anos, você inicia a vida shinobi com o elemento ${E[el][1]} <b>${E[el][0]}</b>.`);
log(a>=12?'Você já se formou como <b>Genin</b>. Vá à Torre do Hokage para pegar missões!':a<=10?'Você é <b>Estudante da Academia</b>. Complete quatro aulas práticas e passe no exame de graduação antes de sair da Academia.':'Você é <b>Estudante da Academia</b>. Treine e converse com Iruka para fazer o exame!','sys');
log('Dica: clique em personagens para interagir, ou escreva livremente o que quer fazer. Missões vão de rank D a S, e os chefes só aparecem nas mais perigosas.','sys')}
</script></body></html>
