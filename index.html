<!DOCTYPE html>

<style>
/* ===== Tema e base visual ===== */
:root{--bg:#fbf4e8;--cd:#fff;--tx:#2a2118;--mu:#7a6a58;--ac:#e8590c;--bd:#e3d5bf;--hp:#e03131;--ck:#1c7ed6;--lv:#d6336c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#15110d;--cd:#211b15;--tx:#f1e8da;--mu:#a8987f;--bd:#3a3026}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:14px}

/* ===== Tipografia e containers ===== */
h1{font-size:24px;margin:8px 0}h3,h4{margin:10px 0 6px}h4{color:var(--mu);font-size:14px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:8px}
.loc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.b{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:48px;font:inherit;line-height:1.35;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;cursor:pointer;text-align:left;overflow-wrap:anywhere;transition:border-color .15s,background-color .15s,transform .15s}
.b:hover{border-color:var(--ac);transform:translateY(-1px)}.b:active{transform:translateY(0)}.b:focus-visible{outline:3px solid var(--ck);outline-offset:2px}.b small{display:block;color:var(--mu);font-size:12px;line-height:1.35}
.p{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;font-weight:600}
.lock{opacity:.55}
input[type=text],input[type=number]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
.br{position:relative;height:18px;background:var(--bg);border:1px solid var(--bd);border-radius:9px;margin:4px 0;overflow:hidden;font-size:12px}
.br i{position:absolute;left:0;top:0;bottom:0;opacity:.45}.br span{position:relative;padding-left:8px}
.world{margin:8px 0;padding:9px 11px;border-left:4px solid var(--ck);background:var(--bg);border-radius:4px;color:var(--tx)}.world.alert{border-color:var(--ac)}
.status-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.status-name{display:block;font-size:18px;font-weight:700}.status-sub{display:block;color:var(--mu);font-size:13px}.status-rank{font-weight:700;color:var(--ac)}
.status-bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 10px;margin-top:8px}.status-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--bd)}.status-meta span{font-size:13px}.status-meta b{color:var(--mu);font-size:11px;text-transform:uppercase}
.status-attributes{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px;margin-top:8px}.status-attributes span{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;background:var(--bg);border-radius:6px}.status-attributes small{color:var(--mu)}
.mode-choice label{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--bd);border-radius:8px;padding:10px;cursor:pointer}.mode-choice input{width:auto;margin:4px 0 0}.mode-choice small{display:block;color:var(--mu);font-size:12px}
#log{height:132px;position:sticky;top:0;z-index:5;overflow-y:auto;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:8px 12px}
#log p{margin:5px 0}.sys{color:var(--mu);font-style:italic}.ok{color:#2f9e44;font-weight:600}.bad{color:var(--hp)}.bt{font-weight:600}
.chat-more{margin-top:8px;color:var(--mu)}.chat-more summary{width:max-content;max-width:100%;padding:6px 0;cursor:pointer;font-size:14px;font-weight:600;color:var(--tx)}
.category-nav{position:sticky;top:140px;z-index:4;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:6px 0;background:var(--cd)}
.category-tab{min-height:42px;padding:7px 5px;align-items:center;text-align:center}.category-tab.cat-active{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.rk{display:inline-block;min-width:22px;text-align:center;border-radius:6px;color:#fff;font-weight:700;padding:0 5px;margin-right:6px}
.rkD{background:#868e96}.rkC{background:#2f9e44}.rkB{background:#1c7ed6}.rkA{background:#7048e8}.rkS{background:#c92a2a}
.el label{display:block;border:1px solid var(--bd);border-radius:10px;padding:8px;cursor:pointer}
.el input{margin-right:6px}[hidden]{display:none!important}
.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1;min-width:0}.row>.b{flex:0 0 auto}
@media(max-width:480px){main{padding:10px}.c{padding:10px}.row{flex-direction:column;align-items:stretch}.row>.b{width:100%}.b{padding:10px}}
@media(max-width:640px){#log{height:100px}.category-nav{top:108px;grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><main>
<!-- ===== Tela de criação do personagem ===== -->
<section id="cr">
<h1>🍥 Naruto RPG: Caminho do Shinobi</h1>
<div class="c"><p>Crie seu shinobi e viva livremente em Konoha: converse, treine, duele, faça amizades, enfrente missões de rank D a S e derrote chefes lendários.</p>

<div id="elementChoice"><h4>Elemento</h4><div class="g el" id="els"></div></div>
<div class="row"><button class="b p" style="flex:1" onclick="start()">Iniciar jornada</button><button class="b" id="ct" onclick="cont()" hidden>Continuar</button></div></div>
</section>

<!-- ===== Tela principal do jogo ===== -->
<section id="gm" hidden>
<div class="c" id="st"></div>
<div id="log"></div>
<div class="c" id="pn"></div>
<div class="row"><button class="b" onclick="newg()">Novo jogo</button></div>
</section>
</main>

else{topic='geral';const h=esc(text.slice(0,70)+(text.length>70?'…':''));replies=[`Entendi: “${h}”. O que aconteceu depois?`,'Isso parece importante para você. Como se sente a respeito?','Hm, quero entender melhor. O que você faria nessa situação?']}
if(VOZ[id]?.[topic])replies=VOZ[id][topic];

else if(t=='team'){if(!B.team?.length)return log('Você ainda não tem aliados na equipe.','sys');if(B.teamUsed)return log('A equipe já usou sua ação cooperativa nesta luta.','sys');B.teamUsed=true;d=Math.round(B.team.reduce((total,id)=>{const specialty=N[id][5][0],stat=AT.includes(specialty)?S[specialty]:S.tai;return total+7+stat*.45+N[id][4][1]*.2},0));const allyNames=B.team.map(id=>N[id][0]).join(' e ');m=`🤝 <b>${allyNames}</b> combina suas habilidades com as suas! Dano conjunto: <b>${d}</b>.`;B.team.forEach(id=>rel(id,1))}

if(B.hp<=0){log(`🏆 <b>${B.n}</b> foi derrotado!`,'ok');const o=B.o,bs=B.boss;B=null;mode='map';gain(o.sp?12:18);o.win&&o.win();if(bs){S.kit++;S.pill++;log('🎁 O chefe deixa suprimentos: +1 kit médico e +1 pílula.','ok')}return render()}
enemyTurn();B.df=0;
if(S.hp<=0){const sp=B.o.sp;B=null;mode='map';if(sp){S.hp=1;gain(6);if(X){X=null;S.cd.ex=S.day;log('❌ Você foi eliminado do exame. Tente de novo amanhã.','bad')}log('😮‍💨 Você perdeu o duelo, mas aprendeu algo.')}else{S.hp=Math.ceil(S.mh/2);S.ryo=Math.floor(S.ryo*.8);S.loc='hospital';M=null;S.pres={};log('😵 Você desmaiou e acorda no hospital. Perdeu parte dos ryo.','bad');tick(3)}}

const e=Math.round(B.atk*R(8,12)/10*(B.df?.4:1)*(B.el&&mu(B.el,S.el)>1?1.3:1));S.hp-=e;log(`💥 ${B.n} ataca: <b>${e}</b> de dano.`,'bad')}

const vJt=()=>'<h3>🎯 Praticar jutsu</h3><small style="color:var(--mu)">A cada 8 usos a Maestria sobe (máx. 5): +12% de dano e −7% de custo por nível. Usar em combate e treinar com alguém também conta.</small><div class="g" style="margin-top:8px">'+S.jt.map(k=>btn(`${jn(k)}<small>Maestria ${mlv(k)}/5 · ${jc(k)} chakra</small>`,`prac('${k}')`)).join('')+back+'</div>';
const vSen=()=>{const id=T,n=N[id];return `<h3>🎓 Treinar com ${n[0]}</h3><small style="color:var(--mu)">Afinidade 40+. Elementos: ${els().length}/${Math.max(1,S.rk)} (Chunin libera o 2º, Jounin o 3º).</small>`+SEN[id].map(e=>`<h4>${E[e][1]} ${E[e][0]}</h4><div class="g">`+[0,1,2].map(i=>{const k=e+':'+i,has=S.jt.includes(k);return btn(`${has?'✔ ':''}${E[e][3][i]}<small>${has?'Dominado · Maestria '+mlv(k):'Nv '+TL[i]+' · '+TC[i]+' ryo'}</small>`,has?"log('Você já domina esta técnica.','sys')":`teach('${k}')`,has?'lock':'')}).join('')+'</div>').join('')+`<div class="row">${back}</div>`};
const vEx=()=>{const g=EXS[X.rk][X.s],quiz=g.t=='quiz',team=g.t=='team',total=quiz?g.qs.length:team?g.tasks.length:g.c,prompt=quiz?g.qs[X.i][0]:X.cur[0],choices=quiz?g.qs[X.i][1].map((text,j)=>[text,j,'']):X.cur[1].map((choice,j)=>[choice[0],j,choice[1]]);return `<h3>🏟️ ${g.n}</h3><small style="color:var(--mu)">Fase ${X.s+1}/${EXS[X.rk].length} · tarefa ${X.i+1}/${total} · acertos ${X.ok} (mínimo ${g.need})</small>`+(team?`<div class="world">🤝 Esquadrão: ${X.squad.map(id=>N[id][0]).join(' e ')} · confiança ${X.trust}%</div>`:'')+`<p>${prompt}</p><div class="g">`+choices.map(([text,j,stat])=>btn(`${text}<small>${team?`Coordenação · ${stat.toUpperCase()}`:quiz?'Resposta':`Usa ${stat.toUpperCase()}`}</small>`,`exa(${j})`)).join('')+'</div>'};
const V={map:vMap,npc:vNpc,date:vDate,battle:vBattle,mis:vMis,goal:vGoal,ms:vBoard,shop:vShop,jt:vJt,sen:vSen,team:vTeam,ex:vEx,assignment:vAssignment};
function render(){
$('#st').innerHTML=`<div class="status-heading"><div><span class="status-name">${esc(S.n)}</span><span class="status-sub">${S.a} anos · ${E[S.el][1]} ${E[S.el][0]} · ${S.style||'Equilibrado'}</span></div><span class="status-rank">${RK[S.rk]} · Nível ${S.lv} · ${S.power||'Regular'}</span></div>`+
`<div class="status-bars">`+bar('❤️ Vida',S.hp,S.mh,'hp')+bar('💠 Chakra',S.ck,S.mc,'ck')+bar('✨ Experiência',S.xp,S.lv*40,'ac')+`</div>`+
`<div class="status-meta"><span><b>Ryō</b><br>💰 ${S.ryo}</span><span><b>Calendário</b><br>Dia ${S.day} · ${TM[S.t]} · Ano ${1+(S.worldYears||0)}</span><span><b>Próximo aniversário</b><br>${DAYS_PER_YEAR-(S.ageDays||0)} dias</span><span><b>Missões</b><br>📜 ${S.done} concluídas</span><span><b>Equipe</b><br>🤝 ${(S.team||[]).length}/2 aliados</span><span><b>Condição</b><br>Fadiga ${S.fatigue||0}% · Reputação ${S.rep||0}</span><span><b>Equipamento</b><br>🩹 ${S.kit} kits · 💊 ${S.pill} pílulas</span></div>`+
`<div class="status-attributes"><span><small>Ninjutsu</small><b>${S.nin}</b></span><span><small>Taijutsu</small><b>${S.tai}</b></span><span><small>Velocidade</small><b>${S.vel}</b></span><span><small>Inteligência</small><b>${S.int}</b></span><span><small>Carisma</small><b>${S.car}</b></span></div>`;
$('#pn').innerHTML=V[mode]()}

/* ===== Bloco 10: inicialização do jogo ===== */
$('#els').innerHTML=Object.keys(E).map((k,i)=>`<label><input type="radio" name="el" value="${k}" ${i?'':'checked'}>${E[k][1]} ${E[k][0]}</label>`).join('');
function updateBuildMode(){$('#elementChoice').hidden=document.querySelector('input[name=build]:checked').value=='random'}
updateBuildMode();
if(ld())$('#ct').hidden=false;
const show=()=>{$('#cr').hidden=true;$('#gm').hidden=false;render()};
function cont(){const v=ld();S=Object.assign(fresh(v.n,v.a,v.el),v);S.pres={};S.team=Array.isArray(S.team)?S.team.filter(id=>N[id]).slice(0,2):[];[0,1,2].forEach(i=>S.lv>=[1,4,8][i]&&learn(S.el+':'+i));mode=S.assignment?.status=='active'?'assignment':'map';show();log('Você retoma sua jornada em Konoha.','sys')}
function newg(){if(confirm('Começar um novo jogo? O progresso atual será perdido.')){try{localStorage.removeItem(SV);localStorage.removeItem('naruto-rpg-v1')}catch(e){}location.reload()}}
function start(){const n=$('#nm').value.trim()||'Shinobi',a=Math.min(40,Math.max(6,+$('#ag').value||12)),randomMode=document.querySelector('input[name=build]:checked').value=='random',el=randomMode?P(Object.keys(E)):document.querySelector('input[name=el]:checked').value,build=randomMode?P(BUILDS):null;
S=fresh(n,a,el);if(a>=16)ST.forEach(k=>S[k]+=2);
if(randomMode){const tier=R(1,3);S.style=build.name;S.power=['Iniciante','Experiente','Prodígio'][tier-1];S.lv=tier;S.mh+=10*(tier-1);S.mc+=6*(tier-1);S.hp=S.mh;S.ck=S.mc;S[build.main]+=R(3,6);S[build.support]+=R(1,3)}
else S[({fogo:'nin',agua:'int',vento:'vel',terra:'tai',relampago:'nin'})[el]]+=2;
mode='map';$('#log').innerHTML='';show();
log(`🍃 Bem-vindo(a) a Konoha, <b>${esc(n)}</b>! Aos ${a} anos, você inicia a vida shinobi com o elemento ${E[el][1]} <b>${E[el][0]}</b>.`);
if(randomMode)log(`🎲 Seu destino foi sorteado: <b>${S.style}</b>, poder <b>${S.power}</b> e nível ${S.lv}.`,'bt');
log(a>=12?'Você já se formou como <b>Genin</b>. Vá à Torre do Hokage para pegar missões!':a<=10?'Você é <b>Estudante da Academia</b>. Complete quatro aulas práticas e passe no exame de graduação antes de sair da Academia.':'Você é <b>Estudante da Academia</b>. Treine e converse com Iruka para fazer o exame!','sys');
log('Dica: clique em personagens para interagir, ou escreva livremente o que quer fazer. Missões vão de rank D a S, e os chefes só aparecem nas mais perigosas.','sys')}
</script></body></html>
